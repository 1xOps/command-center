name: Release

# One release = one tag `command-center-vX.Y.Z` on the commit whose cli/package.json says X.Y.Z.
# `build` runs the tests and packs the tarball; `publish` waits for a named approver in the `release`
# environment (the HITL gate), then publishes to npm with provenance (OIDC trusted publishing, no token)
# and creates the GitHub release. The file name stays mcp-server-release.yml: npm's trusted publisher
# is registered against it. Rehearsal: run by hand with `rehearsal` ticked; it publishes nothing.
on:
  push:
    tags: ['command-center-v*']
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Build and pack only; publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mcp-server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        name: Tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "command-center-v$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"; exit 1
          fi
      - run: npm test
      - name: No runtime dependencies
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies??{}).length) { console.error('runtime dependencies need owner approval'); process.exit(1) }"
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            cli/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    # A real publish only ever comes from a version tag; a manual run may only rehearse.
    if: startsWith(github.ref, 'refs/tags/command-center-v') || (github.event_name == 'workflow_dispatch' && inputs.rehearsal)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # GitHub release
      id-token: write   # npm provenance (OIDC)
    defaults:
      run:
        working-directory: cli
    env:
      VERSION: ${{ needs.build.outputs.version }}
      REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: cli/release
      - name: npm publish (provenance)
        run: |
          # ./ prefix: without it npm parses release/x.tgz as GitHub shorthand owner/repo
          TGZ=$(ls ./release/*.tgz)
          if [ "$REHEARSAL" = "true" ]; then npm publish "$TGZ" --dry-run --provenance --access public; exit 0; fi
          if npm view "@1xops/command-center@$VERSION" version >/dev/null 2>&1; then echo "npm already has $VERSION"; exit 0; fi
          npm publish "$TGZ" --provenance --access public
      - name: GitHub release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="command-center-v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Command Center $VERSION" --generate-notes --verify-tag
