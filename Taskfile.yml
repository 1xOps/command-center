# 1xOps Command Center. `task check` is the local gate before any push; GitHub Actions runs the same tests on three OSes.
version: '3'

tasks:
  setup:
    desc: "Turn on the standard git hooks in this clone (secret scan before commit, message check, tests before push)."
    cmds:
      - git config core.hooksPath .githooks
      - bash .githooks/pre-commit --self-test
      - bash .githooks/commit-msg --self-test
      - bash .githooks/pre-push --self-test

  check:
    desc: "Run every test (Node 24, no dependencies)."
    dir: cli
    cmds:
      - npm test

  connectors:
    desc: "Check this machine's connectors now (account, access, expiry). Exit 0 ok, 1 warning, 2 failure."
    cmds:
      - node cli/bin/command-center.mjs check {{.CLI_ARGS}}

  evidence:
    desc: "Side by side on this machine: Claude Code's own `claude mcp list` against `command-center check`; writes docs/evidence/<os>-<UTC date>.json."
    cmds:
      - node cli/scripts/side-by-side.mjs
